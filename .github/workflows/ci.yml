name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: 0.24.4
  AGENTICA_SHA256: 2397e67f89f4ad5f939d0d1f9ff5b5f8dd89f31629d1af8c4a6732e03467cac6

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the pinned Agentica release
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/$archive"
          echo "${AGENTICA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      # The stylesheet and the script are built from app/ and committed: the build must give the same files. The runner's
      # Node is enough; esbuild and sass are the pinned versions of package-lock.json.
      - name: Assets are up to date
        run: |
          node --version
          npm ci
          make assets-check

      # The compiled programs of the specs and tests (`_build/bytecode`). The compiler names each one by a hash of its
      # source and of the binary (its size and modified time, which the archive of a release keeps), so the pinned binary
      # downloaded and extracted again gives the same names (checked: a fresh copy hits), and a run finds what an earlier
      # one compiled. The key is the version of Agentica and the sources; a run with other sources starts from the nearest
      # older cache and compiles only what changed.
      - name: Cache the compiled programs
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: _build
          key: agentica-${{ env.AGENTICA_VERSION }}-${{ hashFiles('agentica.lock', 'campfire.agc', 'src/**', 'specs/**', 'test/**') }}
          restore-keys: |
            agentica-${{ env.AGENTICA_VERSION }}-

      # The locked packages (Bond), checked against the hashes of agentica.lock.
      - name: Install the packages
        run: |
          agentica --version
          make install

      - name: Check
        run: make check

      # `agentica.toml` sets blank_line_after_end, which the formatter writes and `check` also enforces.
      - name: Format
        run: make fmt-check

      # The features of specs/ (they listen on 127.0.0.1 only) and the tests of test/.
      - name: Test
        run: make test
