name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The tests must run the native SQLite driver of agentica-db (built by the first program that imports it, with the
  # runner's gcc); without this a missing library would quietly leave the FFI driver.
  AGENTICA_DB_SQLITE_DRIVER: native

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the pinned Agentica release
        uses: agentica-lang/setup-agentica@v1
        with:
          version: 0.31.0
          sha256: 1f72c23972c1e5a6c04af2d289f947f5cf96116bea01543ac61208c0136fad7e # linux-x86_64

      # The stylesheet and the script are built from app/ and committed: the build must give the same files. The runner's
      # Node is enough; esbuild and sass are the pinned versions of package-lock.json.
      - name: Assets are up to date
        run: |
          node --version
          npm ci
          make assets-check

      # The locked packages (Bond), checked against the hashes of agentica.lock.
      - name: Install the packages
        run: |
          agentica --version
          cc --version
          make install

      - name: Check
        run: make check

      # `agentica.toml` sets blank_line_after_end, which the formatter writes and `check` also enforces.
      - name: Format
        run: make fmt-check

      # The features of specs/ (they listen on 127.0.0.1 only) and the tests of test/. Each scenario makes its SQLite file
      # under TMPDIR, which is put in memory: the runner's /tmp is on disk.
      - name: Test
        run: |
          export TMPDIR=/dev/shm/campfire-test
          mkdir -p "$TMPDIR"
          make test
