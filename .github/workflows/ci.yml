name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AGENTICA_VERSION: 0.26.1
  AGENTICA_SHA256: 68c3e825cb14148e45c47b21b6ef66036c5ad17a2cdf36948f47e1415bae5524
  # The tests must run the native SQLite driver of agentica-db (built by the first program that imports it, with the
  # runner's gcc); without this a missing library would quietly leave the FFI driver.
  AGENTICA_DB_SQLITE_DRIVER: native

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the pinned Agentica release
        run: |
          archive="agentica-${AGENTICA_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/agentica-lang/agentica/releases/download/${AGENTICA_VERSION}/$archive"
          echo "${AGENTICA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/agentica-${AGENTICA_VERSION}-linux-x86_64/bin" >> "$GITHUB_PATH"

      # The stylesheet and the script are built from app/ and committed: the build must give the same files. The runner's
      # Node is enough; esbuild and sass are the pinned versions of package-lock.json.
      - name: Assets are up to date
        run: |
          node --version
          npm ci
          make assets-check

      # The locked packages (Bond), checked against the hashes of agentica.lock.
      - name: Install the packages
        run: |
          agentica --version
          cc --version
          make install

      - name: Check
        run: make check

      # `agentica.toml` sets blank_line_after_end, which the formatter writes and `check` also enforces.
      - name: Format
        run: make fmt-check

      # The features of specs/ (they listen on 127.0.0.1 only) and the tests of test/.
      - name: Test
        run: make test
