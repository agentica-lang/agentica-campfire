name = "campfire"

# Every bare `end` is followed by an empty line (AGENTS.md).
[style]
blank_line_after_end = true

[dependencies]
bond = { git = "https://github.com/agentica-lang/bond", tag = "0.15.0", override = true }
db = { git = "https://github.com/agentica-lang/agentica-db", tag = "0.11.0", subdir = "src/db" }
channels = { git = "https://github.com/agentica-lang/packages", tag = "bond-channels-0.6.2", subdir = "bond-channels" }
jobs = { git = "https://github.com/agentica-lang/packages", tag = "jobs-0.2.0", subdir = "jobs" }
s3 = { git = "https://github.com/agentica-lang/packages", tag = "s3-0.1.0", subdir = "s3" }

# The system SQLite, for the version reader (`extern "sqlite3"` in src/campfire/repo/version_reader.agc).
[native.sqlite3]
linux = { system = "libsqlite3.so.0" }
macos = { system = "libsqlite3.dylib" }
windows = { system = "winsqlite3.dll" }
