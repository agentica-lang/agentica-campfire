# Runs Campfire from this checkout: `docker compose up -d --build`, then open http://127.0.0.1:3000.
# Put the session secret in .env (not in git): SECRET_KEY_BASE=$(openssl rand -hex 64).
# Local changes (a network, an address, a public url) go in docker-compose.override.yml, which compose
# reads on its own; keep it out of git.
services:
  campfire:
    build: .
    image: agentica-campfire:local
    init: true
    restart: unless-stopped
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      CAMPFIRE_HOST: 0.0.0.0
      CAMPFIRE_PORT: "3000"
    ports:
      # Only this machine until the first account exists (see First run).
      - "127.0.0.1:3000:3000"
    volumes:
      - campfire-storage:/rails/storage

volumes:
  campfire-storage:
